---
- name: Create Odoo project directory
  ansible.builtin.file:
    path: /opt/odoo
    state: directory
    mode: '0755'

- name: Copy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2 
    dest: /opt/odoo/docker-compose.yml

# --- Рекомендованная задача, заменяющая две последние ---
- name: Deploy Odoo containers (Simplified)
  community.docker.docker_compose_v2:
    project_name: odoo
    definition: "{{ lookup('ansible.builtin.template', 'docker-compose.yml.j2') }}"
    project_dir: /opt/odoo # <-- Используйте project_dir вместо args.chdir
    state: present
    # removed_orphans: yes # <-- Очень полезная опция
    # build: no # Если не собираете образ локально
    
