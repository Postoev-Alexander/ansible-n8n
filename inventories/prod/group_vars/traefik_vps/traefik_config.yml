# inventory/prod/group_vars/traefik_config.yml
---
# Общие настройки доменов
main_domain: "winzardy.com" # Ваш основной домен

# Настройки Traefik
traefik_api_insecure: false # В production отключаем insecure API
traefik_enable_dashboard_access: true # Если вы хотите доступ к дашборду
traefik_dashboard_port: 8080 # Порт для дашборда Traefik